apiVersion: v1
kind: Secret
metadata:
  name: dclaw-learn-secret
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-learn
    app.kubernetes.io/part-of: dclaw-platform
type: Opaque
stringData:
  # Shared cluster PostgreSQL — one database per app (see project memory:
  # never create a per-app postgres pod).
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@dclaw-shared-postgres:5432/dclaw_learn"
  APP_ENV: "production"
  JWT_SECRET: "dclaw-learn-local-jwt-secret-change-in-real-prod"
