# Default values for dclaw-learn
replicaCount: 2

frontend:
  image:
    repository: ghcr.io/dclawstack/dclaw-learn
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

backend:
  image:
    repository: ghcr.io/dclawstack/dclaw-learn-backend
    tag: latest
    pullPolicy: IfNotPresent
  port: 8093
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  env:
    - name: PORT
      value: "8093"
    - name: DATABASE_URL
      value: "postgresql+asyncpg://postgres:postgres@dclaw-learn-db-rw:5432/dclaw_learn"
    - name: REDIS_URL
      value: "redis://redis.dclaw-core.svc.cluster.local:6379/0"

database:
  enabled: true
  storage: 10Gi
  instances: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

ingress:
  enabled: true
  className: nginx
  host: learn.dclawstack.io
  tls:
    enabled: true
    secretName: dclaw-learn-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

service:
  type: ClusterIP

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
